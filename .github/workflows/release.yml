name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:ci
      - run: npm sbom --sbom-format spdx --omit dev > sbom.spdx.json
      - name: Create the release with test report and SBOM attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" reports/junit.xml sbom.spdx.json \
            --title "${GITHUB_REF_NAME}" --generate-notes

  deploy-production:
    needs: release
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "Pilot deploy to production of ${GITHUB_REF_NAME}. No real target; this records a GitHub deployment."
